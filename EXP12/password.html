<!DOCTYPE html>
<html>
<head>
    <title>Password Validation</title>
</head>
<body>

    <h2>Password Validation</h2>

    <form method="POST">
        {% csrf_token %}

        Enter Password:
        <input type="password" name="password" required>

        <button type="submit">Submit</button>
    </form>

    <h3>{{ msg }}</h3>

</body>
</html>
